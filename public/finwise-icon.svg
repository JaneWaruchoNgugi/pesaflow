<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="pf-flow" x1="0.15" y1="0.05" x2="0.85" y2="0.95">
      <stop offset="0" stop-color="#F7941E"/>
      <stop offset="1" stop-color="#EE3E2B"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="116" fill="#FFF8F1"/>

